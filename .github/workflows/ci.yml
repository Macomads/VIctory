name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:  # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  build-windows:
    name: Build Windows (victory.exe)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build release with diagnostics
        run: cargo build --profile release -p victory --features diagnostics --bins --locked
      - name: Upload victory.exe
        uses: actions/upload-artifact@v4
        with:
          name: victory-windows
          path: |
            target/release/victory.exe
            target/release/victory-play.exe
            target/release/victory-warm.exe
          retention-days: 7