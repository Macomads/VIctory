name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare verified BCPack format tables
        shell: pwsh
        run: ./Initialize-FormatTables.ps1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        env:
          VICTORY_TESTS_ALLOW_SOFTWARE_SKIP: "1"
        run: cargo test --workspace --locked

  build-windows:
    name: Build Windows (victory.exe)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Build release with diagnostics
        run: cargo build --profile release -p victory --features diagnostics --bins --locked
      - name: Upload victory.exe
        uses: actions/upload-artifact@v4
        with:
          name: victory-windows
          path: |
            target/release/victory.exe
            target/release/victory-play.exe
            target/release/victory-warm.exe
          retention-days: 7